<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Navy Background with Smooth Corners -->
  <rect width="512" height="512" rx="100" fill="#09101d"/>
  
  <!-- Subtle Outer Gold Accent Circle -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.6"/>
  
  <!-- Scales of Justice (Terazi) in Rich Gold -->
  <g fill="#fbbf24" stroke="#fbbf24">
    <!-- Center Pillar -->
    <rect x="244" y="110" width="24" height="280" rx="10"/>
    <circle cx="256" cy="98" r="24"/>
    
    <!-- Base -->
    <rect x="156" y="374" width="200" height="32" rx="8"/>
    <rect x="186" y="354" width="140" height="20" rx="6"/>
    
    <!-- Horizontal Crossbeam -->
    <path d="M 90 165 L 422 165" stroke="#fbbf24" stroke-width="20" stroke-linecap="round"/>
    <circle cx="90" cy="165" r="12"/>
    <circle cx="422" cy="165" r="12"/>
    
    <!-- Left Scale Chains & Pan -->
    <path d="M 90 165 L 55 300" stroke="#fbbf24" stroke-width="6"/>
    <path d="M 90 165 L 125 300" stroke="#fbbf24" stroke-width="6"/>
    <path d="M 25 300 C 25 350, 155 350, 155 300 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    
    <!-- Right Scale Chains & Pan -->
    <path d="M 422 165 L 387 300" stroke="#fbbf24" stroke-width="6"/>
    <path d="M 422 165 L 457 300" stroke="#fbbf24" stroke-width="6"/>
    <path d="M 357 300 C 357 350, 487 350, 487 300 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
  </g>
</svg>
